name: Lecture attendance sync (수동)

# 평소에는 **Vercel Cron이 5분마다** 부른다(vercel.json). 이 워크플로는
# 그 자리를 대신하지 않고, 손으로 한 번 돌리고 싶을 때만 쓰는 버튼이다.
#
# 한동안 여기에 예약을 걸어뒀었다. "Hobby 요금제는 크론이 하루 한 번"이라는
# 잘못된 전제 때문이었는데, 실제로는 Pro라 Vercel에서 1분 단위까지 된다.
# 게다가 GitHub의 예약은 부하가 걸리면 조용히 버려진다 — 10분마다로 걸어둔
# 것이 하루 2번만 돈 날이 있었다(2026-08-08). 그래서 예약은 Vercel로 옮겼다.
#
# 쓰는 때: 연동을 고친 직후 바로 확인하고 싶을 때. Actions 탭에서 이 워크플로를
# 골라 [Run workflow]를 누르면 된다.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 동기화 한 번 부르기
        run: |
          curl -sS -f -m 90 -X GET "https://kaujm.vercel.app/api/cron/lecture-attendance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
