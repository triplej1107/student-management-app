name: Lecture attendance sync

# 맥가이7 등하원 명단을 읽어와 강의·클리닉 출결에 반영한다.
#
# ── 왜 이런 이상한 모양인가 ────────────────────────────────────────
# Vercel Hobby 요금제는 cron을 하루 한 번만 돌릴 수 있어서 GitHub Actions로
# 부른다. 그런데 **GitHub의 schedule은 믿을 수 없다.** 부하가 걸리면 예약을
# 조용히 버린다. 2026-08-08에 실제로 확인한 것:
#
#   - "*/10"(10분마다)로 걸어둔 이 워크플로가 그날 **2번** 돌았다.
#   - 시간당 1번짜리 "잊지마"도 하루 24번이 아니라 5~8번만 돌고 있었다.
#
# 그래서 예약이 뜨는 횟수에 기대지 않는다. **한 번 뜬 실행이 계속 살아서**
# 5분마다 스스로 부른다. GitHub이 6시간에 한 번만 띄워줘도 빈틈이 안 생긴다.
#
# concurrency로 새 실행이 뜨면 옛 실행을 끈다 — 안 그러면 겹쳐 돌면서
# 맥가이7을 쓸데없이 두드린다.
#
# 한국 시간 09:00~23:59에만 부른다. 그 밖의 시간엔 루프만 돌고 건너뛴다.
# 평일에도 부르는 이유 — 등하원 로그로 클리닉 출결까지 자동화했기 때문이다.
# 평일에 안 돌리면 클리닉만 하러 온 학생이 키오스크를 찍어도 앱에 안 들어오고,
# 시각이 지나 자동 결석으로 표시된 학생이 늦게 와도 지각으로 안 바뀐다.
on:
  schedule:
    # 매시 정각. 이 중 몇 개만 실제로 떠도 루프가 메운다.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: lecture-attendance-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # GitHub의 작업 한도는 6시간. 그 앞에서 스스로 끝낸다.
    timeout-minutes: 350
    steps:
      - name: 5분마다 동기화 (한 실행이 최대 5시간 45분 산다)
        run: |
          END=$(( $(date +%s) + 20700 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            HOUR=$(TZ=Asia/Seoul date +%H)
            # 10 진수로 강제 — "08"을 8진수로 읽어 터지는 것을 막는다.
            if [ "$((10#$HOUR))" -ge 9 ]; then
              # 실패해도 루프는 계속 돈다. 한 번 못 불렀다고 그날을 통째로
              # 날리면 안 된다 — 실패는 앱이 macgai_sync_log에 남긴다.
              curl -sS -m 60 -X GET "https://kaujm.vercel.app/api/cron/lecture-attendance" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true
              echo ""
            fi
            sleep 300
          done
