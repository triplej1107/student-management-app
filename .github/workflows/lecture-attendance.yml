name: Lecture attendance sync

# 맥가이7 등하원 명단을 읽어와 강의·클리닉 출결에 반영한다.
#
# Vercel Hobby 요금제는 cron을 하루 한 번만 돌릴 수 있어서, "잊지마"와
# 같은 방식으로 GitHub Actions에서 호출한다.
#
# cron은 UTC라 9시간을 빼야 한다.
#   토·일 UTC 00:00~14:50 = 한국 토·일 09:00~23:50 (강의 + 클리닉)
#   평일 UTC 04:00~14:50 = 한국 평일 13:00~23:50 (클리닉만)
#
# 평일도 도는 이유 — 등하원 로그로 **클리닉 출결까지 자동화**했기 때문이다.
# 평일에 안 돌리면 클리닉만 하러 온 학생이 키오스크를 찍어도 앱에 안 들어오고,
# 시각이 지나 자동 결석으로 표시된 학생이 늦게 와도 지각으로 안 바뀐다.
on:
  schedule:
    - cron: "*/10 0-14 * * 6,0"
    - cron: "*/10 4-14 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call lecture-attendance endpoint
        run: |
          curl -sS -f -X GET "https://kaujm.vercel.app/api/cron/lecture-attendance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
