name: Lecture attendance sync

# 맥가이7 등원 명단을 읽어와 강의 출결에 반영한다.
#
# Vercel Hobby 요금제는 cron을 하루 한 번만 돌릴 수 있어서, "잊지마"와
# 같은 방식으로 GitHub Actions에서 호출한다.
#
# 주말(토·일) 강의 시간대에만 10분마다. cron은 UTC라 9시간을 빼야 한다 —
# UTC 토·일 00:00~14:50이 한국 시간 토·일 09:00~23:50이다. 평일에는 강의가
# 없으므로 돌리지 않는다(나중에 클리닉 출결까지 자동화하면 그때 넓힌다).
on:
  schedule:
    - cron: "*/10 0-14 * * 6,0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call lecture-attendance endpoint
        run: |
          curl -sS -f -X GET "https://kaujm.vercel.app/api/cron/lecture-attendance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
