name: Reminder check (수동)

# 평소에는 **Vercel Cron이 5분마다** 부른다(vercel.json). 이 워크플로는
# 손으로 한 번 돌리고 싶을 때만 쓰는 버튼이다.
#
# 예약을 여기 걸어뒀던 이유와 옮긴 이유는 lecture-attendance.yml에 적어뒀다.
# 요약하면, GitHub의 예약은 시간당 1번으로 걸어도 하루 5~8번만 돌았다.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 잊지마 확인 한 번 부르기
        run: |
          curl -sS -f -m 60 -X GET "https://kaujm.vercel.app/api/cron/reminder-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
