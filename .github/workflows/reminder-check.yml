name: Reminder check

# "잊지마"의 하루 전 / 1시간 전 알림.
#
# ── 왜 이런 모양인가 ──────────────────────────────────────────────
# Vercel Hobby 요금제는 cron을 하루 한 번만 돌릴 수 있어서 GitHub Actions로
# 부른다. 그런데 **GitHub의 schedule은 믿을 수 없다.** 시간당 1번으로 걸어둔
# 이 워크플로가 실제로는 하루 5~8번만 돌고 있었다(2026-08-08 확인). 3시간에
# 한 번꼴이라 "1시간 전" 알림이 제때 못 나가고 아예 건너뛰기도 했다.
#
# 그래서 lecture-attendance와 같은 방식으로 바꿨다 — **한 번 뜬 실행이 계속
# 살아서** 5분마다 스스로 부른다. 같은 알림이 두 번 가지는 않는다. 보낸 건
# pushed_at이 찍혀서 다음부터 후보에서 빠진다(reminders.ts).
#
# 한국 시간 09:00~21:59에만 부른다. 조용시간(22시~9시)에는 라우트가 어차피
# 아무것도 안 하지만, 굳이 두드릴 이유도 없다.
on:
  schedule:
    # 매시 정각. 이 중 몇 개만 실제로 떠도 루프가 메운다.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: reminder-check
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # GitHub의 작업 한도는 6시간. 그 앞에서 스스로 끝낸다.
    timeout-minutes: 350
    steps:
      - name: 5분마다 확인 (한 실행이 최대 5시간 45분 산다)
        run: |
          END=$(( $(date +%s) + 20700 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            HOUR=$(TZ=Asia/Seoul date +%H)
            # 10 진수로 강제 — "08"을 8진수로 읽어 터지는 것을 막는다.
            if [ "$((10#$HOUR))" -ge 9 ] && [ "$((10#$HOUR))" -lt 22 ]; then
              # 실패해도 루프는 계속 돈다. 한 번 못 불렀다고 그날을 날리면 안 된다.
              curl -sS -m 60 -X GET "https://kaujm.vercel.app/api/cron/reminder-check" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true
              echo ""
            fi
            sleep 300
          done
